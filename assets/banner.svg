<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Hamza Mehboob — Mobile and web products that ship. Flutter, React Native, Next.js, Node.js. Taking on new clients.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="1" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="aurora" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="760" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.4" stop-color="#A78BFA"/>
      <stop offset="0.75" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;120 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="money" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <g filter="url(#blur)" opacity="0.55">
      <circle cx="960" cy="90" r="150" fill="#2DD4BF">
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 30;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="290" r="170" fill="#8B5CF6">
        <animateTransform attributeName="transform" type="translate" values="0 0;-30 -40;0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="780" cy="330" r="130" fill="#EC4899">
        <animateTransform attributeName="transform" type="translate" values="0 0;40 -20;0 0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1170" cy="40" r="80" fill="#FB923C"/>
    </g>

    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <rect x="60" y="52" width="292" height="34" rx="17" fill="#2DD4BF" fill-opacity="0.10" stroke="#2DD4BF" stroke-opacity="0.45"/>
      <circle cx="82" cy="69" r="9" fill="#22C55E" opacity="0.35">
        <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="82" cy="69" r="5" fill="#22C55E"/>
      <text x="98" y="74" font-size="13" font-weight="700" letter-spacing="2" fill="#A7F3D0">TAKING ON NEW CLIENTS</text>

      <text x="58" y="158" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Hamza Mehboob</text>
      <text x="60" y="214" font-size="38" font-weight="700" fill="url(#aurora)" letter-spacing="-0.5">Mobile &amp; web products that ship.</text>
      <text x="60" y="254" font-size="19" fill="#94A3B8">Flutter · React Native · Next.js · Node.js — idea to App Store</text>

      <g font-size="14" font-weight="600" fill="#E2E8F0">
        <rect x="60" y="278" width="128" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="124" y="299" text-anchor="middle">iOS &amp; Android</text>
        <rect x="198" y="278" width="100" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="248" y="299" text-anchor="middle">Web apps</text>
        <rect x="308" y="278" width="162" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="389" y="299" text-anchor="middle">Admin dashboards</text>
        <rect x="480" y="278" width="152" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="556" y="299" text-anchor="middle">APIs &amp; real-time</text>
      </g>

      <text x="60" y="340" font-size="13" fill="#64748B">Karachi, Pakistan · Working with clients worldwide</text>

      <g filter="url(#shadow)">
        <rect x="910" y="46" width="186" height="360" rx="32" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
        <rect x="920" y="56" width="166" height="340" rx="24" fill="url(#screen)"/>
        <rect x="975" y="64" width="56" height="14" rx="7" fill="#020617"/>
        <rect x="932" y="90" width="142" height="150" rx="16" fill="url(#video)" opacity="0.85"/>
        <rect x="942" y="100" width="40" height="18" rx="9" fill="#EF4444"/>
        <text x="962" y="113" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="1">LIVE</text>
        <circle cx="1003" cy="165" r="22" fill="#FFFFFF" fill-opacity="0.22"/>
        <path d="M996 154 L1014 165 L996 176 Z" fill="#FFFFFF"/>
        <circle cx="946" cy="262" r="12" fill="#2DD4BF" fill-opacity="0.7"/>
        <rect x="966" y="254" width="96" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.35"/>
        <rect x="966" y="266" width="64" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
        <circle cx="946" cy="298" r="12" fill="#F472B6" fill-opacity="0.7"/>
        <rect x="966" y="290" width="84" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.35"/>
        <rect x="966" y="302" width="52" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
        <rect x="932" y="324" width="142" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08"/>
        <circle cx="1058" cy="339" r="11" fill="#EC4899"/>
      </g>

      <g filter="url(#shadow)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5s" repeatCount="indefinite"/>
        <rect x="770" y="70" width="210" height="66" rx="16" fill="#0F172A" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="790" y="98" font-size="17" fill="#FBBF24" letter-spacing="2">★★★★★</text>
        <text x="790" y="122" font-size="13" font-weight="600" fill="#E2E8F0">30 five-star client reviews</text>
      </g>

      <g filter="url(#shadow)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="6s" repeatCount="indefinite"/>
        <rect x="1010" y="226" width="172" height="66" rx="16" fill="#0F172A" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="1028" y="257" font-size="22" font-weight="800" fill="url(#money)">$30K+</text>
        <text x="1028" y="279" font-size="12" font-weight="600" fill="#CBD5E1">earned by a client app</text>
      </g>
    </g>
  </g>
</svg>
